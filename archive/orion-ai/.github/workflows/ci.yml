name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # Backend — pytest + bandit + alembic-check
  # ─────────────────────────────────────────────────────────────────────
  backend:
    name: Backend (pytest + bandit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit

      - name: Run pytest
        env:
          SECRET_KEY: ci-secret-not-for-production-use-only
          ADMIN_PIN: "9999"
          DATABASE_URL: "sqlite:///:memory:"
        run: pytest -q

      - name: Bandit (security lint)
        # Bloqueante: cualquier finding de severidad media o alta falla la build.
        run: bandit -r backend/ -ll -iii

  # ─────────────────────────────────────────────────────────────────────
  # Alembic — verifica que las migraciones aplican limpiamente y que no
  # falten migraciones autogeneradas (modelo desincronizado vs. DB).
  # ─────────────────────────────────────────────────────────────────────
  alembic-check:
    name: Alembic (upgrade + check)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: alembic upgrade head
        env:
          SECRET_KEY: ci-secret-not-for-production-use-only
          DATABASE_URL: "sqlite:///./ci-alembic.db"
        run: alembic upgrade head

      - name: alembic check (no pending autogenerated revisions)
        env:
          SECRET_KEY: ci-secret-not-for-production-use-only
          DATABASE_URL: "sqlite:///./ci-alembic.db"
        # Falla si hay cambios en los modelos sin migración. Si es ruidoso
        # en SQLite (limitaciones de ALTER), comentar la línea o gatear con
        # `continue-on-error: true`.
        run: alembic check
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────────────
  # Frontend — typecheck + lint + build
  # ─────────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (typecheck + lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        # Bloqueante: PR a main/develop debe pasar lint limpio.
        run: npm run lint

      - name: Build (smoke)
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build
