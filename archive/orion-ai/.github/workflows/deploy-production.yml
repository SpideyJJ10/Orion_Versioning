name: Deploy Production

# Pipeline de producción del backend en Render.
#
# Trigger:
#   - push a `main` (auto)
#   - workflow_dispatch (manual)
#
# El frontend lo deploya Vercel directamente desde su Git integration —
# este workflow NO lo dispara, solo orquesta el backend.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false   # nunca cancelar un deploy en vuelo

permissions:
  contents: read

env:
  PROD_API_URL: https://orion-pos.onrender.com

jobs:
  # ─────────────────────────────────────────────────────────────────────
  # 1. Disparar el hook de deploy en Render y esperar a que el servicio
  #    esté sano antes de marcar el job como exitoso.
  # ─────────────────────────────────────────────────────────────────────
  deploy-backend:
    name: Trigger Render prod deploy
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Trigger Render deploy hook
        env:
          HOOK: ${{ secrets.RENDER_PROD_BACKEND_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::RENDER_PROD_BACKEND_HOOK secret not configured."
            echo "Add it in repo Settings → Secrets → Actions."
            exit 1
          fi
          if curl -fsSL -X POST "$HOOK"; then
            echo "✓ Deploy hook accepted"
          else
            echo "::warning::Render hook returned non-zero (may be deploying already)"
          fi

      - name: Wait for backend to be healthy (max 6 min)
        run: |
          echo "Waiting for $PROD_API_URL/api/health to become ready…"
          for i in $(seq 1 36); do
            if curl -fsSL --max-time 10 "$PROD_API_URL/api/health" 2>/dev/null | grep -q '"ok":true'; then
              echo "✓ Backend healthy after ${i} attempts"
              exit 0
            fi
            echo "  attempt $i/36 — not ready yet, sleeping 10s…"
            sleep 10
          done
          echo "❌ Backend did not become healthy in 6 minutes"
          exit 1

  # ─────────────────────────────────────────────────────────────────────
  # 2. Smoke test post-deploy: health + openapi + auth flow.
  # ─────────────────────────────────────────────────────────────────────
  smoke-test:
    name: Smoke test
    runs-on: ubuntu-latest
    needs: deploy-backend
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run smoke test
        env:
          API_URL:        ${{ env.PROD_API_URL }}
          SMOKE_EMAIL:    ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: bash scripts/smoke_test.sh

  # ─────────────────────────────────────────────────────────────────────
  # 3. Sentry release tracking — vincula el commit con la versión
  #    deployada para tener stack traces sourcemap-correctos y enviar la
  #    notificación de "deploy" a Sentry.
  # ─────────────────────────────────────────────────────────────────────
  sentry-release:
    name: Sentry release
    runs-on: ubuntu-latest
    needs: smoke-test
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check Sentry configured
        id: check
        env:
          TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::SENTRY_AUTH_TOKEN not set — skipping release tracking."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create Sentry release
        if: steps.check.outputs.skip == 'false'
        uses: getsentry/action-release@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG:        ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT:    orion-backend
        with:
          environment: production
          version:     ${{ needs.deploy-backend.outputs.sha }}

  # ─────────────────────────────────────────────────────────────────────
  # 4. Resumen al final del workflow.
  # ─────────────────────────────────────────────────────────────────────
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [deploy-backend, smoke-test]
    if: always()
    steps:
      - name: Summary
        run: |
          {
            echo "## Production deploy summary"
            echo ""
            echo "- SHA: \`${{ needs.deploy-backend.outputs.sha }}\`"
            echo "- Backend deploy: ${{ needs.deploy-backend.result }}"
            echo "- Smoke test:     ${{ needs.smoke-test.result }}"
            echo "- API URL:        $PROD_API_URL"
          } >> "$GITHUB_STEP_SUMMARY"
