<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" role="img" aria-label="Zafiro POS">
  <title>Zafiro POS</title>
  <defs>
    <linearGradient id="zg-face-tl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="zg-face-tr" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#0c1f6e"/>
    </linearGradient>
    <linearGradient id="zg-face-l" x1="0" y1="0.2" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#0c1f6e"/>
    </linearGradient>
    <linearGradient id="zg-face-r" x1="1" y1="0.2" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1f6e"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="zg-face-bl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#0a1633"/>
    </linearGradient>
    <linearGradient id="zg-face-br" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#0a1633"/>
    </linearGradient>
    <linearGradient id="zg-z-shadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cdd6f4"/>
    </linearGradient>
    <filter id="zg-soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>

  <!-- Hexagon faceted gem (each face has its own gradient for the cut effect) -->
  <g>
    <!-- top-left face -->
    <path d="M 256 56 L 130 128 L 256 200 Z" fill="url(#zg-face-tl)"/>
    <!-- top-right face -->
    <path d="M 256 56 L 382 128 L 256 200 Z" fill="url(#zg-face-tr)"/>
    <!-- left face -->
    <path d="M 130 128 L 90 256 L 256 200 Z" fill="url(#zg-face-l)"/>
    <!-- right face -->
    <path d="M 382 128 L 422 256 L 256 200 Z" fill="url(#zg-face-r)"/>
    <!-- bottom-left face -->
    <path d="M 90 256 L 256 456 L 256 200 Z" fill="url(#zg-face-bl)"/>
    <!-- bottom-right face -->
    <path d="M 422 256 L 256 456 L 256 200 Z" fill="url(#zg-face-br)"/>
  </g>

  <!-- White stylized "Z" ribbon -->
  <g>
    <!-- soft underglow for ribbon depth -->
    <path d="M 168 162 L 332 162 L 332 198 L 244 198 L 332 318 L 332 354 L 168 354 L 168 318 L 256 318 L 168 198 Z"
          fill="#0a1633" opacity="0.35" filter="url(#zg-soft)"/>

    <!-- top horizontal bar of Z -->
    <path d="M 162 156 L 338 156 L 338 200 L 244 200 L 162 200 Z" fill="url(#zg-z-shadow)"/>
    <!-- diagonal stroke of Z -->
    <path d="M 244 200 L 338 200 L 256 320 L 162 320 Z" fill="#ffffff"/>
    <!-- bottom horizontal bar of Z -->
    <path d="M 162 320 L 338 320 L 338 360 L 162 360 Z" fill="url(#zg-z-shadow)"/>

    <!-- accent ribbon folds (subtle navy slivers to mimic 3D tape) -->
    <path d="M 162 156 L 162 200 L 200 200 L 162 156 Z" fill="#1e3a8a" opacity="0.55"/>
    <path d="M 338 200 L 320 220 L 338 220 Z" fill="#1e3a8a" opacity="0.4"/>
    <path d="M 162 320 L 200 320 L 162 360 Z" fill="#1e3a8a" opacity="0.45"/>
    <path d="M 338 320 L 338 360 L 300 360 L 338 320 Z" fill="#1e3a8a" opacity="0.45"/>
  </g>
</svg>
