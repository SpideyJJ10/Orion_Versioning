[alembic]
# Path to migration scripts.
script_location = migrations

# Template used to generate migration file names.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Timezone for timestamps.
timezone = UTC

# Max length for migration file slugs.
truncate_slug_length = 40

# Version path separator.
version_path_separator = os

# Output encoding for revision files.
output_encoding = utf-8

# DATABASE_URL is loaded dynamically in migrations/env.py from backend.core.config.
# Leave this empty so Alembic does NOT use a hardcoded URL.
sqlalchemy.url =


[post_write_hooks]
# Optional hooks to run after generating migrations (e.g. ruff/black).


# ── Logging ──────────────────────────────────────────────────────────────
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
